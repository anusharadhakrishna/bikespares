<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AutoParts Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-[#181412] text-stone-100 font-sans min-h-screen flex items-center justify-center px-4">

    <div class="max-w-md w-full bg-[#211c18] border border-stone-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <!-- Ambient Glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 rounded-full bg-amber-500/10 blur-2xl pointer-events-none"></div>

        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 border border-amber-500/20 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-motorcycle text-lg"></i>
            </div>
            <span class="text-[10px] uppercase tracking-[0.2em] font-black text-amber-500">Restricted Area</span>
            <h1 class="text-2xl font-black text-stone-100 mt-1">Admin Portal</h1>
            <p class="text-xs text-stone-400 mt-1">Sign in to manage inventory and customer requests</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            {% if form.errors %}
                <div class="px-4 py-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold flex items-center gap-2">
                    <i class="fas fa-circle-exclamation"></i>
                    <span>Invalid username or password. Please try again.</span>
                </div>
            {% endif %}

            <div>
                <label class="block text-xs font-bold text-stone-400 uppercase mb-1.5">Username</label>
                <input type="text" name="username" required autofocus class="w-full bg-[#181412] border border-stone-800 rounded-xl px-4 py-3 text-sm text-stone-100 focus:outline-none focus:border-amber-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-400 uppercase mb-1.5">Password</label>
                <input type="password" name="password" required class="w-full bg-[#181412] border border-stone-800 rounded-xl px-4 py-3 text-sm text-stone-100 focus:outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 font-black text-sm shadow-lg shadow-amber-500/10 transition">
                Secure Sign In
            </button>
        </form>

        <div class="mt-8 text-center border-t border-stone-800/80 pt-6">
            <a href="/" class="text-xs font-bold text-stone-500 hover:text-stone-300 transition">
                &larr; Back to Public Website
            </a>
        </div>
    </div>

</body>
</html>
