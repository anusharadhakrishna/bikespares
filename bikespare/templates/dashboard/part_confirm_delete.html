{% extends 'dashboard/base.html' %}
{% block title %}Delete Part - AutoParts Hub{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-[#211c18] rounded-2xl border border-stone-800/80 shadow-xl overflow-hidden p-6 sm:p-8 text-center mt-10">
    <div class="w-16 h-16 rounded-2xl bg-rose-500/15 text-rose-400 flex items-center justify-center mx-auto mb-4 border border-rose-500/20">
        <i class="fas fa-triangle-exclamation text-2xl"></i>
    </div>
    
    <h2 class="text-xl font-bold font-serif text-stone-100">Delete Part?</h2>
    <p class="text-sm text-stone-400 mt-2">Are you sure you want to delete <strong class="text-stone-200">{{ part.name }}</strong> ({{ part.part_number }})? This action cannot be undone.</p>

    <form method="post" class="mt-6 flex gap-3 justify-center">
        {% csrf_token %}
        <a href="{% url 'dashboard:part_list' %}" class="px-5 py-2.5 bg-stone-800 text-stone-300 hover:bg-stone-700 font-bold text-xs rounded-xl border border-stone-700">
            Cancel
        </a>
        <button type="submit" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-stone-100 font-bold text-xs rounded-xl transition-colors shadow">
            Yes, Delete
        </button>
    </form>
</div>
{% endblock %}
